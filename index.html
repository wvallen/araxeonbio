<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Half The Population, A Fraction Of The Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&display=swap"
          rel="stylesheet"/>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff
        }

        body {
            font-family: 'Montserrat', 'Trebuchet MS', Arial, sans-serif;
            font-size: 1.8em
        }

        /* Full-viewport background container, same pattern as agg.bio */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .background-container img {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: auto;
            min-height: 100%;
        }

        .background-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 55%;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.35) 20%, rgba(255, 255, 255, 0) 100%);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 0.5vh 5vw;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        h1 {
            font-size: 1.4em;
            font-weight: 700;
            color: #CF2384;
            line-height: 1.15;
            margin-bottom: 3vh;
        }

        .bullets {
            list-style: none;
            margin-bottom: 2.5vh;
        }

        .bullets li {
            color: #155577;
            margin-bottom: 0.8vh;
            padding-left: 1.2em;
            position: relative;
            line-height: 1.5;
        }

        .bullets li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.55em;
            width: 0.35em;
            height: 0.35em;
            border-radius: 50%;
            background: #7fa8bb;
        }

        .problem-box {
            border-left: 4px solid #CE2082;
            padding: 0.8vh 1em;
        }

        .problem-label {
            font-weight: 700;
            color: #CE2082;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.2vh;
        }

        .problem-label .sq {
            display: inline-block;
            width: 0.55em;
            height: 0.55em;
            background: #CE2082;
            margin-right: 0.3em;
            vertical-align: middle;
        }

        .problem-text {
            color: #155577;
            line-height: 1.5;
        }

        .bottom {
            margin-top: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
        }

        .bottom img {
            height: 3.9em;
            margin-bottom: 1em;
            margin-top: 1em;
        }

        .bottom span {
            color: #155577;
            font-size: 1.3em;
            line-height: 1.4;
            text-shadow: 0 2px 8px rgba(255,255,255,0.8), 0 1px 3px rgba(255,255,255,0.9);
        }
    </style>
</head>
<body>

<div class="background-container">
    <img src="women.png" alt=""/>
</div>

<div class="content">
    <div class="bottom">
        <img src="Araxeon_Logo.svg" alt="Araxeon Biosciences"/>
        <span>Building the first blood-based longitudinal<br>immune atlas for women's health</span>
    </div>
</div>

</body>
</html>
